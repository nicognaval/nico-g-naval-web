    </div>

  <main>
    <section class="contacto">
      <h1>Contact</h1>
      <p class="contacto-intro">
        If you'd like to get in touch about lessons, concert bookings, or just to say hello, feel free to use this form.
      </p>

      <form action="https://formspree.io/f/xkjwrqrr" method="POST" class="formulario-contacto">

        <div class="campo">
          <label for="nombre">Name</label>
          <input type="text" id="nombre" name="nombre" required>
        </div>

        <div class="campo">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="campo">
          <label for="asunto">Subject</label>
          <select id="asunto" name="asunto">
            <option value="Clases">Lessons</option>
            <option value="Contratación de conciertos">Concert booking</option>
            <option value="Otro">Other</option>
          </select>
        </div>

        <div class="campo">
          <label for="mensaje">Message</label>
          <textarea id="mensaje" name="mensaje" rows="6" required></textarea>
        </div>

        <button type="submit" class="boton-secundario">Send message</button>

      </form>
    </section>
  </main>
