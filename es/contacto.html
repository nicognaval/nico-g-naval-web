  <main>
    <section class="contacto">
      <h1>Contacto</h1>
      <p class="contacto-intro">
        Si quieres escribirme por clases, contrataciones, o simplemente para saludar, puedes usar este formulario.
      </p>

      <form action="https://formspree.io/f/xkjwrqrr" method="POST" class="formulario-contacto">

        <div class="campo">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" required>
        </div>

        <div class="campo">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="campo">
          <label for="asunto">Asunto</label>
          <select id="asunto" name="asunto">
            <option value="Clases">Clases</option>
            <option value="Contratación de conciertos">Contratación de conciertos</option>
            <option value="Otro">Otro</option>
          </select>
        </div>

        <div class="campo">
          <label for="mensaje">Mensaje</label>
          <textarea id="mensaje" name="mensaje" rows="6" required></textarea>
        </div>

        <button type="submit" class="boton-secundario">Enviar mensaje</button>

      </form>
    </section>
  </main>
